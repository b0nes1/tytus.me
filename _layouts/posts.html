---
layout: default
---
<nav class="sidebar">
    <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        {% for post in site.posts %}
        <li><a class="{% if page.url == post.url %}active{% endif %}" href="{{ post.url | relative_url }}">{{ post.title
                }}</a></li>
        {% endfor %}
    </ul>
</nav>
{{ content }}
